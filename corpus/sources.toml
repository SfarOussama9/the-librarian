# Corpus sources for the Librarian: studying abroad from Tunisia.
# Scope: France, Germany, Canada + Erasmus+ (admission, visa, costs, scholarships, work, arrival).
#
# Each [[group]] shares a publisher and metadata; each entry in `sources` is one document.
#   id     unique, stable; used as the file name in corpus/raw/
#   path   relative to the group's `base` (or give a full `url` instead)
#   topic  procedure | admission | visa | costs | scholarship | work | housing | health | language | arrival | general
#   lang   overrides the group language when needed
#
# fetch = "archive" means the live site blocks scripts from here, so the newest
# Wayback Machine snapshot is used. fetch = "reader" goes through Jina Reader
# (r.jina.ai) for sites whose live pages and archive copies are both refused
# from our network. Citations always point to the original URL.

# --------------------------------------------------------------------------- France

